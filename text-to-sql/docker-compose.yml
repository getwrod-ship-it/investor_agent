# Only Qdrant is containerized. The backend (FastAPI agent) runs directly on
# the host because the local BGE embedding/reranker models need the host GPU
# (see bge-embed-rerank-deploy.md). Start it with:
#   docker compose up -d qdrant
# then run the backend on the host:
#   uvicorn app.main:app --app-dir backend --reload
# and optionally the frontend:
#   streamlit run frontend/app.py

services:

  # ---------------------------------------------------------------------------
  # Qdrant — vector store for schema + knowledge base collections
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost:6333' 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_data:
